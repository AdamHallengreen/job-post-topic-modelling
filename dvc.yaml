stages:
  prepare:
    cmd: python src/job_post_topic_modelling/prepare.py
    deps:
    - data/Jobnet.xlsx
    - src/job_post_topic_modelling/prepare.py
    - src/job_post_topic_modelling/sentences.py
    - src/job_post_topic_modelling/utils/find_project_root.py
    - src/job_post_topic_modelling/utils/miscellaneous.py
    params:
    - prepare
    outs:
    - data/texts.parquet
    - data/sentences.parquet
    - output/metrics/prepare.json
  embed:
    cmd: python src/job_post_topic_modelling/embed.py
    deps:
    - data/sentences.parquet
    - src/job_post_topic_modelling/embed.py
    - src/job_post_topic_modelling/embedding_models.py
    - src/job_post_topic_modelling/utils/data_io.py
    - src/job_post_topic_modelling/utils/miscellaneous.py
    - src/job_post_topic_modelling/utils/find_project_root.py
    params:
    - embed
    outs:
    - data/embeddings/
    metrics:
    - output/metrics/embed.json:
        cache: false
  train:
    cmd: >
      POLARS_MAX_THREADS=8
      OMP_NUM_THREADS=8
      MKL_NUM_THREADS=8
      OPENBLAS_NUM_THREADS=8
      NUMEXPR_NUM_THREADS=8
      python src/job_post_topic_modelling/train.py
    deps:
    - data/texts.parquet
    - data/sentences.parquet
    - data/embeddings/
    - src/job_post_topic_modelling/train.py
    - src/job_post_topic_modelling/embed.py
    - src/job_post_topic_modelling/embedding_models.py
    - src/job_post_topic_modelling/utils/data_io.py
    - src/job_post_topic_modelling/utils/find_project_root.py
    - src/job_post_topic_modelling/utils/miscellaneous.py
    params:
    - embed
    - train
    outs:
    - models/bertopic_model/config.json
    - models/bertopic_model/topic_embeddings.safetensors
    - models/bertopic_model/topics.json
    - models/submodels/dimensionality_reduction_model.pkl
    - models/submodels/clustering_model.pkl
    - models/submodels/training_labels.parquet
    - output/predicted_topics_train.parquet
    - output/predicted_topics_agg_train.parquet
    metrics:
    - output/metrics/train.json:
        cache: false
  predict:
    cmd: >
      POLARS_MAX_THREADS=8
      OMP_NUM_THREADS=8
      MKL_NUM_THREADS=8
      OPENBLAS_NUM_THREADS=8
      NUMEXPR_NUM_THREADS=8
      python src/job_post_topic_modelling/predict.py
    deps:
    - models/bertopic_model/config.json
    - models/bertopic_model/topic_embeddings.safetensors
    - models/bertopic_model/topics.json
    - models/submodels/dimensionality_reduction_model.pkl
    - models/submodels/clustering_model.pkl
    - models/submodels/training_labels.parquet
    - data/texts.parquet
    - data/sentences.parquet
    - data/embeddings/
    - src/job_post_topic_modelling/predict.py
    - src/job_post_topic_modelling/embedding_models.py
    - src/job_post_topic_modelling/train.py
    - src/job_post_topic_modelling/utils/data_io.py
    - src/job_post_topic_modelling/utils/find_project_root.py
    - src/job_post_topic_modelling/utils/log_html.py
    - src/job_post_topic_modelling/utils/miscellaneous.py
    params:
    - train
    - predict
    outs:
    - output/predicted_topics.parquet
    - output/predicted_topics_agg.parquet
    - output/metrics/predict.json
  evaluate:
    cmd: >
      POLARS_MAX_THREADS=8
      OMP_NUM_THREADS=8
      MKL_NUM_THREADS=8
      OPENBLAS_NUM_THREADS=8
      NUMEXPR_NUM_THREADS=8
      conda run -n topicmodel312_llama_1 --no-capture-output python src/job_post_topic_modelling/evaluate.py
    deps:
    - models/bertopic_model/config.json
    - models/bertopic_model/topic_embeddings.safetensors
    - models/bertopic_model/topics.json
    - models/submodels/dimensionality_reduction_model.pkl
    - models/submodels/clustering_model.pkl
    - output/predicted_topics_agg_train.parquet
    - output/predicted_topics_agg.parquet
    - src/job_post_topic_modelling/evaluate.py
    - src/job_post_topic_modelling/utils/data_io.py
    - src/job_post_topic_modelling/utils/find_project_root.py
    - src/job_post_topic_modelling/utils/log_html.py
    - src/job_post_topic_modelling/utils/miscellaneous.py
    - output/metrics/prepare.json
    - output/metrics/embed.json
    - output/metrics/train.json
    - output/metrics/predict.json
    params:
    - evaluate
    outs:
    - output/topic_info.csv
    - output/topic_info.parquet
    - output/topic_hierarchy.csv
    - output/topic_hierarchy_all_steps.csv
    - output/bertopic_model_representation
    always_changed: true
  score:
    cmd: python src/job_post_topic_modelling/score.py
    deps:
    - output/predicted_topics_train.parquet
    - models/bertopic_model/topics.json
    - src/job_post_topic_modelling/score.py
    - data/llm_topics/claude-opus-5-5_low_prompt-3678b2ac
    params:
    - score
    outs:
    - output/topics_overview.csv
    metrics:
    - output/metrics/score.json:
        cache: false
  llm_pilot:
    # Code a sample of posts with Claude. Run as an experiment, one per model (see scripts/llm_topics/README.md):
    #   dvc exp run llm_pilot -n pilot-haiku -S llm_pilot.model=claude-haiku-5-5
    cmd: uv run scripts/llm_topics/annotate_jobnet.py --n ${llm_pilot.n_posts} --model ${llm_pilot.model} --metrics output/metrics/llm_pilot.json
    deps:
    - data/Jobnet.xlsx
    - scripts/llm_topics/annotate_jobnet.py
    - scripts/llm_topics/prompt.txt
    params:
    - llm_pilot
    metrics:
    - output/metrics/llm_pilot.json:
        cache: false
metrics:
- output/metrics.json
plots:
- output/plots/images
artifacts:
  topic_info:
    path: output/topic_info.csv
    type: dataset
  topic_hierarchy:
    path: output/topic_hierarchy.csv
    type: dataset
