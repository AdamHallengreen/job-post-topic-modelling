stages:
  prepare:
    cmd: python src/job_post_topic_modelling/prepare.py
    deps:
    - data/Jobnet.xlsx
    - src/job_post_topic_modelling/prepare.py
    - src/job_post_topic_modelling/utils/find_project_root.py
    - src/job_post_topic_modelling/utils/miscellaneous.py
    params:
    - prepare
    outs:
    - data/texts.parquet
    - output/metrics/prepare.json
  embed:
    cmd: python src/job_post_topic_modelling/embed.py
    deps:
    - data/texts.parquet
    - src/job_post_topic_modelling/embed.py
    - src/job_post_topic_modelling/utils/data_io.py
    - src/job_post_topic_modelling/utils/miscellaneous.py
    - src/job_post_topic_modelling/utils/find_project_root.py
    params:
    - embed
    outs:
    - data/embeddings/
    - output/metrics/embed.json
  train:
    cmd: >
      POLARS_MAX_THREADS=8
      OMP_NUM_THREADS=8
      MKL_NUM_THREADS=8
      OPENBLAS_NUM_THREADS=8
      NUMEXPR_NUM_THREADS=8
      python src/job_post_topic_modelling/train.py
    deps:
    - data/texts.parquet
    - data/embeddings/
    - src/job_post_topic_modelling/train.py
    - src/job_post_topic_modelling/embed.py
    - src/job_post_topic_modelling/utils/data_io.py
    - src/job_post_topic_modelling/utils/find_project_root.py
    - src/job_post_topic_modelling/utils/miscellaneous.py
    params:
    - embed
    - train
    outs:
    - models/bertopic_model/config.json
    - models/bertopic_model/topic_embeddings.safetensors
    - models/bertopic_model/topics.json
    - models/submodels/dimensionality_reduction_model.pkl
    - models/submodels/clustering_model.pkl
    - output/predicted_topics_train.parquet
    - output/predicted_topics_agg_train.parquet
    - output/metrics/train.json
  predict:
    cmd: >
      POLARS_MAX_THREADS=8
      OMP_NUM_THREADS=8
      MKL_NUM_THREADS=8
      OPENBLAS_NUM_THREADS=8
      NUMEXPR_NUM_THREADS=8
      python src/job_post_topic_modelling/predict.py
    deps:
    - models/bertopic_model/config.json
    - models/bertopic_model/topic_embeddings.safetensors
    - models/bertopic_model/topics.json
    - models/submodels/dimensionality_reduction_model.pkl
    - models/submodels/clustering_model.pkl
    - src/job_post_topic_modelling/predict.py
    - src/job_post_topic_modelling/train.py
    - src/job_post_topic_modelling/utils/data_io.py
    - src/job_post_topic_modelling/utils/find_project_root.py
    - src/job_post_topic_modelling/utils/log_html.py
    - src/job_post_topic_modelling/utils/miscellaneous.py
    params:
    - train
    - predict
    outs:
    - output/predicted_topics.parquet
    - output/predicted_topics_agg.parquet
    - output/metrics/predict.json
  evaluate:
    cmd: >
      POLARS_MAX_THREADS=8
      OMP_NUM_THREADS=8
      MKL_NUM_THREADS=8
      OPENBLAS_NUM_THREADS=8
      NUMEXPR_NUM_THREADS=8
      python src/job_post_topic_modelling/evaluate.py
    deps:
    - models/bertopic_model/config.json
    - models/bertopic_model/topic_embeddings.safetensors
    - models/bertopic_model/topics.json
    - models/submodels/dimensionality_reduction_model.pkl
    - models/submodels/clustering_model.pkl
    - output/predicted_topics_agg_train.parquet
    - output/predicted_topics_agg.parquet
    - src/job_post_topic_modelling/evaluate.py
    - src/job_post_topic_modelling/utils/data_io.py
    - src/job_post_topic_modelling/utils/find_project_root.py
    - src/job_post_topic_modelling/utils/log_html.py
    - src/job_post_topic_modelling/utils/miscellaneous.py
    - output/metrics/prepare.json
    - output/metrics/embed.json
    - output/metrics/train.json
    - output/metrics/predict.json
    params:
    - evaluate
    outs:
    - output/topic_info.csv
    - output/bertopic_model_representation
    always_changed: true
metrics:
- output/metrics.json
plots:
- output/plots/images
artifacts:
  topic_info:
    path: output/topic_info.csv
    type: dataset
