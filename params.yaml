prepare:
  settings:
    nobs: null
    split_paragraphs: true
    split_sentences: true
  star:
    usestar: 1
embed:
  settings:
    show_progress_bar: true
    batch_size: 64
    device: null
    num_workers: 1
    shard_size: 2000000
  model:
    embedding_model: sentence-transformers/paraphrase-multilingual-mpnet-base-v2
    use_model2vec: false
    pca_dims: 768
train:
  settings:
    top_n_words: 20
    calculate_probabilities: false
    nr_topics: null
    verbose: true
    nobs: 8000000
  seed_topics:
    seeds: null
  dimensionality_reduction:
    model: UMAP
    n_neighbors: 60
    n_components: 5
    min_dist: 0.0
    metric: cosine
    random_state: null
    low_memory: true
    n_jobs: 16
  clustering:
    model: HDBSCAN
    min_cluster_size: 3000
    min_samples: 200
    metric: euclidean
    cluster_selection_method: leaf
    prediction_data: true
    core_dist_n_jobs: 8
predict:
  settings:
    nobs: null
    clustering: false
    batch_mode: false
    full_p_dist: true
    ignore_limit: 0.5
evaluate:
  vectorizer:
    model: CountVectorizer
    ngram_range:
    - 1
    - 3
    min_df: 0.001
    max_features: 1000000
  c_TF_IDF:
    model: c_TF_IDF
    bm25_weighting: false
    reduce_frequent_words: false
  representation:
    model: MMR
    diversity: 0.2
  label_llm:
    use_llm: true
    model: Phi-3-medium-4k-instruct-Q6_K_L.gguf
    model_folder: Phi-3-medium-4k-instruct-GGUF
    gpu_layers: 0
    use_representative_docs: true
    nr_representative_docs: 10
    top_n_words: 10
    n_threads: 15
    pipeline_kwargs:
      max_tokens: 16
      temperature: 0.0
      top_p: 1.0
  settings:
    similarity_phrase: fleksibel
    top_n: 20
    update_topics: true
    oos_prediction: true
    use_cpu: true
    n_levels: 10
